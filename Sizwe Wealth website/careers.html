  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 */\n  --sl-grey-900: #1F2D3D;\n  --sl-grey-800: #33475B;\n  --sl-grey-700: #4A5D72;\n  --sl-grey-600: #64758A;\n  --sl-grey-500: #8494A6;\n  --sl-grey-400: #A7B4C2;\n  --sl-grey-300: #C9D2DC;\n  --sl-grey-200: #E2E8EF;\n  --sl-grey-100: #F0F3F7;\n  --sl-grey-50:  #F7F9FB;\n\n  /* ---- Semantic accents ---- */\n  --sl-success: #1E874B;\n  --sl-success-tint: #E6F3EC;\n  --sl-warning: #C77700;\n  --sl-warning-tint: #FBF0DE;\n  --sl-error:   #C22B2B;\n  --sl-error-tint: #FBEAEA;\n  --sl-info:    #0075C9;\n  --sl-info-tint: #DCEEFA;\n\n  /* ---- Semantic aliases ---- */\n  --color-primary: var(--sl-blue);\n  --color-primary-hover: var(--sl-blue-700);\n  --color-primary-active: var(--sl-blue-900);\n  --color-primary-contrast: var(--sl-white);\n\n  --text-strong: var(--sl-ink);\n  --text-body: var(--sl-grey-800);\n  --text-muted: var(--sl-grey-600);\n  --text-subtle: var(--sl-grey-500);\n  --text-on-brand: var(--sl-white);\n  --text-link: var(--sl-blue);\n  --text-link-hover: var(--sl-blue-900);\n\n  --surface-page: var(--sl-grey-50);\n  --surface-card: var(--sl-white);\n  --surface-sunken: var(--sl-grey-100);\n  --surface-brand: var(--sl-blue);\n  --surface-brand-deep: var(--sl-blue-congress);\n  --surface-tint: var(--sl-blue-50);\n\n  --border-subtle: var(--sl-grey-200);\n  --border-default: var(--sl-grey-300);\n  --border-strong: var(--sl-grey-400);\n  --border-focus: var(--sl-blue);\n}\n<\u002Fstyle>\n  <style>/* Sanlam typography\n   Family: Mulish (substitute for custom \"Sanlam Sans\") for all UI + display.\n   Roboto Mono for tabular data / reference numbers.\n   Type scale is a 1.2 (minor third) ramp on a 16px base. */\n:root {\n  --font-sans: 'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-display: 'Mulish', system-ui, sans-serif;\n  --font-mono: 'Roboto Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* ---- Font sizes ---- */\n  --text-2xs: 0.6875rem;  /* 11px */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-md:  1rem;       /* 16px — base */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: 2.25rem;    /* 36px */\n  --text-4xl: 3rem;       /* 48px */\n  --text-5xl: 3.75rem;    /* 60px */\n\n  /* ---- Weights ---- */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n  --weight-black: 900;\n\n  /* ---- Line heights ---- */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.02em;\n  --tracking-snug: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.08em;\n\n  /* ---- Semantic roles ---- */\n  --role-display: var(--weight-extrabold) var(--text-5xl)/var(--leading-tight) var(--font-display);\n  --role-h1: var(--weight-extrabold) var(--text-4xl)/var(--leading-tight) var(--font-display);\n  --role-h2: var(--weight-bold) var(--text-3xl)/var(--leading-snug) var(--font-display);\n  --role-h3: var(--weight-bold) var(--text-2xl)/var(--leading-snug) var(--font-sans);\n  --role-h4: var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-sans);\n  --role-body: var(--weight-regular) var(--text-md)/var(--leading-normal) var(--font-sans);\n  --role-body-sm: var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-sans);\n  --role-caption: var(--weight-medium) var(--text-xs)/var(--leading-snug) var(--font-sans);\n  --role-overline: var(--weight-bold) var(--text-2xs)/var(--leading-snug) var(--font-sans);\n}\n<\u002Fstyle>\n  <style>/* Sanlam spacing & layout — 4px base grid */\n:root {\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem; AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Sanlam colour system\n   Core brand palette (from brand guidelines):\n   - Lochmara        #0075C9  primary blue\n   - Congress Blue   #003D88  deep secondary blue\n   - White           #FFFFFF\n   Supporting neutrals, semantics and tints are derived to sit harmoniously\n   around the two brand blues. */\n:root {\n  /* ---- Brand core ---- */\n  --sl-blue: #0075C9;            /* Lochmara — primary */\n  --sl-blue-congress: #003D88;   /* Congress Blue — deep */\n  --sl-white: #FFFFFF;\n\n  /* ---- Blue ramp (derived from Lochmara / Congress) ---- */\n  --sl-blue-950: #001B3D;\n  --sl-blue-900: #003D88;\n  --sl-blue-800: #004FA8;\n  --sl-blue-700: #0062BE;\n  --sl-blue-600: #0075C9;\n  --sl-blue-500: #1D8AD6;\n  --sl-blue-400: #4EA6E1;\n  --sl-blue-300: #85C4EC;\n  --sl-blue-200: #B9DDF5;\n  --sl-blue-100: #DCEEFA;\n  --sl-blue-50:  #EFF7FD;\n\n  /* ---- Neutrals (cool-tinted grey to complement the blues) ---- */\n  --sl-ink:      #10233A;   /* near-black, blue-shifted */\n  --sl-grey-900: #1F2D3D;\n  --sl-grey-800: #33475B;\n  --sl-grey-700: #4A5D72;\n  --sl-grey-600: #64758A;\n  --sl-grey-500: #8494A6;\n  --sl-grey-400: #A7B4C2;\n  --sl-grey-300: #C9D2DC;\n  --sl-grey-200: #E2E8EF;\n  --sl-grey-100: #F0F3F7;\n  --sl-grey-50:  #F7F9FB;\n\n  /* ---- Semantic accents ---- */\n  --sl-success: #1E874B;\n  --sl-success-tint: #E6F3EC;\n  --sl-warning: #C77700;\n  --sl-warning-tint: #FBF0DE;\n  --sl-error:   #C22B2B;\n  --sl-error-tint: #FBEAEA;\n  --sl-info:    #0075C9;\n  --sl-info-tint: #DCEEFA;\n\n  /* ---- Semantic aliases ---- */\n  --color-primary: var(--sl-blue);\n  --color-primary-hover: var(--sl-blue-700);\n  --color-primary-active: var(--sl-blue-900);\n  --color-primary-contrast: var(--sl-white);\n\n  --text-strong: var(--sl-ink);\n  --text-body: var(--sl-grey-800);\n  --text-muted: var(--sl-grey-600);\n  --text-subtle: var(--sl-grey-500);\n  --text-on-brand: var(--sl-white);\n  --text-link: var(--sl-blue);\n  --text-link-hover: var(--sl-blue-900);\n\n  --surface-page: var(--sl-grey-50);\n  --surface-card: var(--sl-white);\n  --surface-sunken: var(--sl-grey-100);\n  --surface-brand: var(--sl-blue);\n  --surface-brand-deep: var(--sl-blue-congress);\n  --surface-tint: var(--sl-blue-50);\n\n  --border-subtle: var(--sl-grey-200);\n  --border-default: var(--sl-grey-300);\n  --border-strong: var(--sl-grey-400);\n  --border-focus: var(--sl-blue);\n}\n\n/* Sanlam typography\n   Family: Mulish (substitute for custom \"Sanlam Sans\") for all UI + display.\n   Roboto Mono for tabular data / reference numbers.\n   Type scale is a 1.2 (minor third) ramp on a 16px base. */\n:root {\n  --font-sans: 'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-display: 'Mulish', system-ui, sans-serif;\n  --font-mono: 'Roboto Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* ---- Font sizes ---- */\n  --text-2xs: 0.6875rem;  /* 11px */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-md:  1rem;       /* 16px — base */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: 2.25rem;    /* 36px */\n  --text-4xl: 3rem;       /* 48px */\n  --text-5xl: 3.75rem;    /* 60px */\n\n  /* ---- Weights ---- */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n  --weight-black: 900;\n\n  /* ---- Line heights ---- */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.02em;\n  --tracking-snug: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.08em;\n\n  /* ---- Semantic roles ---- */\n  --role-display: var(--weight-extrabold) var(--text-5xl)/var(--leading-tight) var(--font-display);\n  --role-h1: var(--weight-extrabold) var(--text-4xl)/var(--leading-tight) var(--font-display);\n  --role-h2: var(--weight-bold) var(--text-3xl)/var(--leading-snug) var(--font-display);\n  --role-h3: var(--weight-bold) var(--text-2xl)/var(--leading-snug) var(--font-sans);\n  --role-h4: var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-sans);\n  --role-body: var(--weight-regular) var(--text-md)/var(--leading-normal) var(--font-sans);\n  --role-body-sm: var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-sans);\n  --role-caption: var(--weight-medium) var(--text-xs)/var(--leading-snug) var(--font-sans);\n  --role-overline: var(--weight-bold) var(--text-2xs)/var(--leading-snug) var(--font-sans);\n}\n\n/* Sanlam spacing & layout — 4px base grid */\n:root {\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n  --space-16: 4rem;     /* 64 */\n  --space-20: 5rem;     /* 80 */\n  --space-24: 6rem;     /* 96 */\n\n  --container-sm: 640px;\n  --container-md: 768px;\n  --container-lg: 1024px;\n  --container-xl: 1200px;\n  --container-2xl: 1440px;\n\n  --gutter: var(--space-6);\n}\n\n/* Sanlam effects — radii, shadows, borders, motion.\n   Sanlam's visual language is clean and corporate: moderate rounding,\n   soft cool-tinted shadows, no heavy skeuomorphism. */\n:root {\n  /* ---- Corner radii ---- */\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;    /* default for cards, inputs, buttons */\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --border-hair: 1px;\n  --border-thick: 2px;\n\n  /* ---- Shadows (cool blue-grey, low spread) ---- */\n  --shadow-xs: 0 1px 2px rgba(16, 35, 58, 0.06);\n  --shadow-sm: 0 1px 3px rgba(16, 35, 58, 0.08), 0 1px 2px rgba(16, 35, 58, 0.04);\n  --shadow-md: 0 4px 12px rgba(16, 35, 58, 0.10), 0 2px 4px rgba(16, 35, 58, 0.05);\n  --shadow-lg: 0 12px 28px rgba(16, 35, 58, 0.14), 0 4px 8px rgba(16, 35, 58, 0.06);\n  --shadow-xl: 0 24px 48px rgba(16, 35, 58, 0.18);\n  --shadow-focus: 0 0 0 3px rgba(0, 117, 201, 0.30);\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"8efa137f-2238-4251-b2e3-e7456fa3e0b3\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--surface-card); color: var(--text-body); font: var(--role-body); }\n    a { color: var(--text-link); text-decoration: none; }\n    a:hover { color: var(--text-link-hover); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%\">\n\n  <header style=\"position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border-subtle)\">\n    <div style=\"height:3px;background:linear-gradient(90deg,var(--sl-blue) 0%,var(--sl-blue-congress) 100%)\"><\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:28px;flex-wrap:wrap\">\n      <a href=\"index.html\" style=\"display:flex;align-items:center;gap:18px;text-decoration:none\">\n        <img src=\"01d3cb1e-7960-4a63-b991-555cd54aecac\" alt=\"Sizwe Wealth\" style=\"height:32px;width:auto;display:block\">\n        <span style=\"width:1px;height:40px;background:var(--border-default)\"><\u002Fspan>\n        <img src=\"88d36b14-0964-467e-912f-73533f74cbf3\" alt=\"Kapital BlouSter, gemagtig deur Sanlam\" style=\"height:38px;width:auto;display:block\">\n      <\u002Fa>\n      <nav style=\"display:flex;gap:24px;margin-left:auto;flex-wrap:wrap;font:var(--role-body-sm);font-weight:var(--weight-semibold);align-items:center\">\n        <a href=\"index.html\" style=\"color:var(--text-body)\">Home<\u002Fa>\n        <a href=\"group.html\" style=\"color:var(--text-body)\">The group<\u002Fa>\n        <a href=\"products.html\" style=\"color:var(--text-body)\">Products &amp; services<\u002Fa>\n        <a href=\"resources.html\" style=\"color:var(--text-body)\">Resources<\u002Fa>\n        <a href=\"careers.html\" style=\"color:var(--sl-blue-congress);border-bottom:2px solid var(--color-primary);padding-bottom:3px\">Careers<\u002Fa>\n        <a href=\"contact.html\" style=\"color:var(--text-body)\">Contact<\u002Fa>\n        <a href=\"book.html\" style=\"text-decoration:none\"><x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Button\" variant=\"primary\" size=\"sm\" hint-size=\"120px,34px\">Book a session<\u002Fx-import><\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"background:#323e48;border-bottom:1px solid rgba(255,255,255,0.14)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:40px 28px 34px;display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font:var(--role-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--sl-blue-200)\">Careers<\u002Fspan>\n      <h1 style=\"margin:0;font:var(--role-display);font-size:var(--text-4xl);color:#fff;letter-spacing:var(--tracking-tight);max-width:820px;text-wrap:pretty\">Build your own practice with us.<\u002Fh1>\n      <p style=\"margin:0;font:var(--role-body);font-size:var(--text-lg);line-height:var(--leading-relaxed);color:rgba(255,255,255,0.74);max-width:640px;text-wrap:pretty\">We train our own advisers. If you want to build a book in and around Bloemfontein, we bring the accreditation support, the mentorship and the systems — and the practice you build is yours.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:34px 28px;display:flex;flex-direction:column;gap:28px\">\n    <h2 style=\"margin:0;font:var(--role-h2);color:var(--sl-blue-congress);letter-spacing:var(--tracking-tight);max-width:640px;text-wrap:pretty\">What we put behind you<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n      <x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Card\" padding=\"md\" accent=\"{{ true }}\" hint-size=\"100%,200px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-tint);color:var(--color-primary);display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Icon\" name=\"graduation-cap\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n          <div style=\"font:var(--role-h4);color:var(--text-strong)\">Accreditation, paid for<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:var(--text-muted)\">RE5, class-of-business and product accreditation, with study time and the exam costs covered.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Card\" padding=\"md\" accent=\"{{ true }}\" hint-size=\"100%,200px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-tint);color:var(--color-primary);display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Icon\" name=\"users\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n          <div style=\"font:var(--role-h4);color:var(--text-strong)\">A mentor from day one<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:var(--text-muted)\">You sit with an experienced adviser in real client meetings before you run your own.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Card\" padding=\"md\" accent=\"{{ true }}\" hint-size=\"100%,200px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-tint);color:var(--color-primary);display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Icon\" name=\"briefcase\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n          <div style=\"font:var(--role-h4);color:var(--text-strong)\">Systems and admin support<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:var(--text-muted)\">Quoting, compliance, record-keeping and back-office support so you spend your time with clients.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Card\" padding=\"md\" accent=\"{{ true }}\" hint-size=\"100%,200px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-tint);color:var(--color-primary);display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"SanlamDesignSystem_c1c142.Icon\" name=\"trending-up\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n          <div style=\"font:var(--role-h4);color:var(--text-strong)\">A book you own<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:var(--text-muted)\">You build your own client base and earn on it. The practice you grow stays yours.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#323e48;border-top:1px solid rgba(255,255,255,0.14);border-bottom:1px solid rgba(255,255,255,0.14)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:34px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font:var(--role-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--sl-blue-200)\">Who does well here<\u002Fspan>\n        <h2 style=\"margin:0;font:var(--role-h2);color:#fff;letter-spacing:var(--tracking-tight);text-wrap:pretty\">It is not a sales job.<\u002Fh2>\n        <p style=\"margin:0;font:var(--role-body);color:rgba(255,255,255,0.68);max-width:340px;text-wrap:pretty\">The advisers who last here are the ones who like the planning work and are comfortable being the person a family phones on a bad day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14)\">\n          <div style=\"font:var(--role-body);font-weight:var(--weight-bold);color:#fff\">A matric certificate<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:rgba(255,255,255,0.68);max-width:520px\">A relevant tertiary qualification helps but is not required. We will guide you through the regulatory exams.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14)\">\n          <div style=\"font:var(--role-body);font-weight:var(--weight-bold);color:#fff\">Your own transport<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:rgba(255,255,255,0.68);max-width:520px\">Client meetings happen where the client is, across Bloemfontein and the wider Free State.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14)\">\n          <div style=\"font:var(--role-body);font-weight:var(--weight-bold);color:#fff\">A clear credit and criminal record<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:rgba(255,255,255,0.68);max-width:520px\">A regulatory requirement for financial services representatives.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14);border-bottom:1px solid rgba(255,255,255,0.14)\">\n          <div style=\"font:var(--role-body);font-weight:var(--weight-bold);color:#fff\">Self-discipline<\u002Fdiv>\n          <p style=\"margin:0;font:var(--role-body-sm);color:rgba(255,255,255,0.68);max-width:520px\">Your diary is your own. That is the best and the hardest part of the job.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:34px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <h2 style=\"margin:0;font:var(--role-h2);color:var(--sl-blue-congress);letter-spacing:var(--tracking-tight);text-wrap:pretty\">Apply to join<\u002Fh2>\n      <p style=\"margin:0;font:var(--role-body);color:var(--text-body);max-width:420px;text-wrap:pretty\">Send us your details and a short note on why advice interests you. If there is a fit, we will invite you in for a conversation.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:8px\">\n        <div style=\"font:var(--role-body-sm);font-weight:var(--weight-bold);color:var(--text-strong)\">Or come to us directly<\u002Fdiv>\n        <div style=\"font:var(--role-body-sm);color:var(--text-muted)\">21 Reid St, Westdene, Bloemfontein · Mon–Fri 8am–5pm<\u002Fdiv>\n        <a href=\"tel:0780198359\" style=\"font:var(--role-body-sm);font-weight:var(--weight-bold)\">078 019 8359<\u002Fa>\n      <\u002Fdiv>\n
